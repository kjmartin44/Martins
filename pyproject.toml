[project]
name = "promoter-tf-drugs"
version = "0.1.0"
description = "Gene promoter -> activating TF -> approved drug repurposing pipeline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
promoter-tf-drugs = "promoter_tf_drugs.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
