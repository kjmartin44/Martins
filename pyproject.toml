[project]
name = "generoutes"
version = "0.1.0"
description = "Ranks approved drugs that might raise or lower one gene, from several independent kinds of evidence"
readme = "README.md"
license = {text = "CC-BY-4.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
chemistry = ["rdkit>=2023.9", "scikit-learn>=1.3"]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Repository = "https://github.com/kjmartin44/Martins"
Documentation = "https://github.com/kjmartin44/Martins/tree/main/docs"

[project.scripts]
generoutes = "generoutes.cli:main"
generoutes-shortlist = "generoutes.shortlist:main"
generoutes-explain = "generoutes.explain:main"
generoutes-dock = "generoutes.docking:main"

[tool.setuptools.packages.find]
include = ["generoutes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
