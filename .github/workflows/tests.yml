name: Tests and packaging

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The project supports 3.10 and is developed on 3.12, and 3.12
      # accepts f-string forms (PEP 701) that 3.10 rejects, so a file can
      # be fine locally and unimportable here. Say so in one line, before
      # anything is installed, rather than as an error per test file.
      - name: Source must parse on this Python
        run: python -m compileall -q generoutes scripts tests
      - run: python -m pip install -e ".[dev,chemistry]"
      # -rs names every skipped test. About ten skip when an
      # optional file is absent from data/, which on a clean
      # checkout is always - so they run only on a maintainer's
      # machine, and without this nothing says which ones.
      - run: python -m pytest -q -rs
        env:
          GENEROUTES_CACHE: ${{ runner.temp }}/ptd-cache
      - run: python scripts/generate_cli_docs.py
        if: matrix.python == '3.12'
      - run: git diff --exit-code -- docs/cli.md
        if: matrix.python == '3.12'
      - run: python -m build
      - name: Install and test the wheel outside the checkout
        shell: bash
        run: |
          python -m pip uninstall -y generoutes
          python -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          generoutes --demo --gene DEMOGENE --out wheel-demo
          generoutes-shortlist --help
          generoutes-explain --help
